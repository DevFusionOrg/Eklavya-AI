name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: python -m pip install "./backend[dev]"
      - name: Unit and integration tests
        working-directory: backend
        run: python -m pytest -q
      - name: Run mock OCR/AI evaluation
        working-directory: backend
        run: python evals/run.py --output ../artifacts/eval-metrics.json
      - name: Upload evaluation metrics
        uses: actions/upload-artifact@v4
        with:
          name: eval-metrics
          path: artifacts/eval-metrics.json

  e2e:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright golden paths
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  load:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Locust
        run: python -m pip install -r loadtest/requirements.txt
      - name: Run documented smoke load
        run: |
          mkdir -p artifacts
          locust -f loadtest/locustfile.py --host http://localhost:8000 \
            --headless -u 1 -r 1 -t 10s --csv artifacts/locust || true
      - name: Upload load results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-results
          path: artifacts/locust*
