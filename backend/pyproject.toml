[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eklavya-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "celery[redis]>=5.4,<6",
  "redis>=5.0,<6",
  "httpx>=0.27,<1",
  "argon2-cffi>=23.1,<26",
  "PyJWT>=2.9,<3",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["black>=24.8", "hypothesis>=6.110", "mypy>=1.11", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["celery", "argon2", "argon2.exceptions"]
ignore_missing_imports = true
